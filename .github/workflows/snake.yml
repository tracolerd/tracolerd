name: Generate Snake Animation

on:
  schedule:
    # প্রতি ১২ ঘণ্টা পর পর অটোমেটিক আপডেট হবে
    - cron: "0 */12 * * *"
  
  # ম্যানুয়ালি রান করার জন্য
  workflow_dispatch:
  
  # মেইন ব্র্যাঞ্চে পুশ করলে অটোমেটিক রান হবে
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # Snake SVG জেনারেট করা
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: tracolerd
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # জেনারেট হওয়া SVG ফাইলটি 'output' ব্র্যাঞ্চে পুশ করা
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
