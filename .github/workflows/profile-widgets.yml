name: Generate Profile Widgets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  # Streak stats + Trophies -> "output-widgets" branch.
  # NOTE: this is a DIFFERENT branch than Snake's "output" branch on purpose.
  # crazy-max/ghaction-github-pages replaces the target branch's content with
  # whatever is in build_dir on every run — if this job and the Snake workflow
  # both pushed to "output", each would wipe out the other's SVG files.
  widgets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate Streak Stats
        uses: muhammad-fiaz/github-readme-streak-stats@v1.0.1
        with:
          USERNAME: tracolerd
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THEME: radical
          OUTPUT_PATH: dist/github-streak-stats.svg

      - name: Generate Trophies
        # continue-on-error: this action lives on an actively-changing dev
        # branch and has broken before. If it fails, we still want the Streak
        # Stats file (generated above) to get pushed in the step below.
        continue-on-error: true
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: tracolerd
          file: dist/github-trophies.svg
          theme: radical
          # Needs a Personal Access Token with "read:user" scope — the
          # default GITHUB_TOKEN can't read general profile info (followers,
          # stars, etc.), which is why this step was failing with
          # "Failed to fetch user info". Add TROPHY_PAT as a repo secret.
          token: ${{ secrets.TROPHY_PAT }}

      - name: Push widgets to output-widgets branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output-widgets
          build_dir: dist
          commit_message: "Update streak stats & trophies"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Animated 3D contribution calendar -> its own "output-3d-contrib" branch
  # (already isolated from the other two, no change needed here).
  contrib-3d:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: tracolerd
          SETTING_JSON: conf/github-profile-3d-contrib.json

      - name: Push 3D graph to output-3d-contrib branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output-3d-contrib
          build_dir: profile-3d-contrib
          commit_message: "Update 3D contribution calendar"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
